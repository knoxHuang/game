<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源加载检查</title><style>body{background:#10232c;color:#eee;font:14px monospace;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{width:40px}button{min-height:48px}</style><h1>资源加载检查</h1><pre></pre><div id="images"></div><div id="probe"></div><script src="./asset-probe-phaser.js"></script><script>const assets={"lobby-cutaway": "/game/assets/lobby/cutaway-harbor.webp", "lobby-investigator": "/game/assets/lobby/investigator-cutaway.webp", "lobby-tools": "/game/assets/lobby/brass-tools.webp", "lobby-lantern": "/game/assets/lobby/departure-lantern.webp", "ui-panel": "/game/assets/ui/brass-panel.webp", "battle-hud-frame": "/game/assets/ui/harbor-mystery-frame.webp", "actor-atlas": "/game/assets/game/actors.webp", "enemy-atlas": "/game/assets/game/enemies-readable.webp", "item-atlas": "/game/assets/game/items.webp", "field-atlas": "/game/assets/game/field-tools.webp", "boss-atlas": "/game/assets/game/bosses.webp", "tide-boss-readable": "/game/assets/dungeons/tide_colossus/boss-readable.webp", "pier-ground": "/game/assets/game/pier-ground.webp"};
const log=(s)=>{document.querySelector('pre').textContent+=s+'\n';};
log(navigator.userAgent);log(location.href);
for(const mode of ['unset','undefined','anonymous']){
 const image=new Image();if(mode!=='unset')image.crossOrigin=mode==='undefined'?undefined:mode;
 image.onload=()=>log('Image '+mode+': OK '+image.naturalWidth);image.onerror=()=>log('Image '+mode+': ERROR');
 image.src=assets['lobby-cutaway'];document.querySelector('#images').append(image);
}
class Probe extends Phaser.Scene {
 preload(){
  this.load.on('loaderror',f=>log('FAIL '+f.key+' '+f.src));
  this.load.on('filecomplete',(key)=>log('DONE '+key+' exists='+this.textures.exists(key)));
  for(const [key,url]of Object.entries(assets))this.load.image(key,url);
 }
 create(){log('CREATE loaded='+Object.keys(assets).filter(k=>this.textures.exists(k)).length+'/13');log('Renderer '+this.game.renderer.type);}
}
new Phaser.Game({type:Phaser.AUTO,width:32,height:32,parent:'probe',loader:{imageLoadType:'HTMLImageElement',maxRetries:1},audio:{noAudio:true},scene:Probe});
</script>
