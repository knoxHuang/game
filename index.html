<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142830" />
    <meta name="description" content="选择外勤职业，调查雾港沉船区，击败潮汐巨像，带回证据并升级调查所。" />
    <title>雾港调查所</title>
    <link rel="preload" as="image" href="/game/assets/lobby/cutaway-harbor-mobile.webp" fetchpriority="high" />
    <style>
      .startup-loading{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;gap:20px;padding:24px;background:radial-gradient(ellipse at 50% 40%,#203c40,#09151c 75%);color:#ead5a0;text-align:center;font:16px/1.6 'Songti SC',serif}
      .startup-loading h1{margin:0;font-size:30px;letter-spacing:.15em}.startup-loading p{margin:0;font-size:14px;max-width:320px}
      .startup-loading progress{appearance:none;width:min(280px,100%);height:14px;margin:auto;overflow:hidden;border:1px solid #957343;background:#09151c;border-radius:2px}
      .startup-loading progress::-webkit-progress-bar{background:#09151c}.startup-loading progress::-webkit-progress-value{background:#c8a562}.startup-loading progress::-moz-progress-bar{background:#c8a562}
      .startup-loading button{min-height:48px;margin:auto;padding:0 24px;border:1px solid #957343;background:#283127;color:#f5dea4;font:inherit;cursor:pointer}.startup-loading [hidden]{display:none}
    </style>
    <script type="module" crossorigin src="/game/assets/index-DAxf8naQ.js"></script>
    <link rel="stylesheet" crossorigin href="/game/assets/index-CvBHvnXJ.css">
  </head>
  <body>
    <section id="startup-loading" class="startup-loading" role="status" aria-live="polite">
      <h1>雾港调查所</h1>
      <progress max="1" value="0" aria-label="启动资源加载进度"></progress>
      <p data-startup-message>正在载入游戏程序…</p>
      <button type="button" hidden>重试资源</button>
    </section>
    <div id="app">
      <div id="scene" aria-label="游戏场景"></div>
      <div id="hud"></div>
      <div id="screen"></div>
      <div id="controls"></div>
      <div id="overlay"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="orientation"><strong>请回到竖屏</strong><span>冒险已经暂停。</span></div>
    </div>
  </body>
</html>
